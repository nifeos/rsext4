name: mutation
on:
  schedule:
    # This repository's own weekday, tried at 08, 10 and 12 UTC. Print the line with
    # `python3 helpers/mutation_plan.py schedule <repository name>` in the template checkout.
    - cron: '9 8,10,12 * * 0'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mutation:
    # issues: write lets a red run file the crate's issue and a green one close it; without it the
    # run still runs and the filing ends in a warning.
    permissions:
      contents: read
      issues: write
    uses: partsfoundry/crate-workflows/.github/workflows/mutation.yml@eef0a564a45656471bedcb93e4789f507387bc89
    with:
      # The template's 200 assumes about 15 seconds a mutant. Here a mutant takes about 32
      # seconds with two jobs: a 31-second rebuild of the crate and its tests, then the tests,
      # and a mutant that makes a loop endless runs to cargo-mutants' 300-second timeout. A
      # hundred sat right at the 60-minute job timeout (run 45893848454, 2026-11-26, cancelled
      # 34 of its 116 shards); fifty take about 30 minutes, with room for several timeouts. At
      # fifty, 11,553 mutants make 232 shards, inside the 256 a matrix holds.
      mutants-per-shard: 50
      max-parallel: 8
