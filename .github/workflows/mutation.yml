name: mutation
on:
  schedule:
    # This repository's own weekday, tried at 08, 10 and 12 UTC. Print the line with
    # `python3 helpers/mutation_plan.py schedule <repository name>` in the template checkout.
    - cron: '9 8,10,12 * * 0'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mutation:
    # issues: write lets a red run file the crate's issue and a green one close it; without it the
    # run still runs and the filing ends in a warning.
    permissions:
      contents: read
      issues: write
    uses: partsfoundry/crate-workflows/.github/workflows/mutation.yml@5624e56bc72eb766dbc2739b12431861b65d229b
    with:
      # The template's 200 assumes about 15 seconds a mutant. Here run 45928657005 took about 40
      # runner-seconds a mutant: every mutant that no earlier test catches runs the whole suite,
      # whose unmutated pass took 150 to 300 seconds on a hosted runner. With the growth test's
      # images copied sparsely, nextest, no debug information and a timeout of three times the
      # unmutated run, a local sample of 100 mutants took 10.4 seconds a mutant instead of 22.0,
      # and caught and missed the same mutants. That projects to about 16 seconds a mutant on a
      # hosted runner. A hundred make shards of about 29 minutes: 11,553 mutants make 116 shards,
      # inside the 256 a matrix holds, about 56 runner-hours and 7.3 hours at eight at once.
      # nextest runs no doctests, and this crate has none.
      mutants-per-shard: 100
      test-tool: nextest
      max-parallel: 8
