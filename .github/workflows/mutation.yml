name: mutation
on:
  schedule:
    # This repository's own weekday, tried at 08, 10 and 12 UTC. Print the line with
    # `python3 helpers/mutation_plan.py schedule <repository name>` in the template checkout.
    - cron: '9 8,10,12 * * 0'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mutation:
    # issues: write lets a red run file the crate's issue and a green one close it; without it the
    # run still runs and the filing ends in a warning.
    permissions:
      contents: read
      issues: write
    uses: partsfoundry/crate-workflows/.github/workflows/mutation.yml@eef0a564a45656471bedcb93e4789f507387bc89
    with:
      # The template's 200 assumes about 15 seconds a mutant. Here run 45928657005
      # took about 40 runner-seconds a mutant at fifty a shard: shards of 33 minutes, 127
      # runner-hours, 16 hours at eight at once. Every mutant that no earlier test catches runs the
      # whole suite, whose unmutated pass took 150 to 300 seconds on a hosted runner, against
      # cargo-mutants' 300-second timeout. Copying the growth test's images sparsely cut a local
      # sample of 100 mutants from 22 to 17 seconds a mutant, which projects to about 26 seconds
      # on a hosted runner, and the suite still runs close enough to the timeout on a slow one that
      # some survivors time out. Fifty-five make shards of about 28 minutes, with room for those
      # timeouts: 11,553 mutants make 211 shards, inside the 256 a matrix holds.
      mutants-per-shard: 55
      max-parallel: 8
