name: fuzz
on:
  schedule:
    - cron: '45 6 * * 2'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzz:
    uses: partsfoundry/crate-workflows/.github/workflows/fuzz.yml@5624e56bc72eb766dbc2739b12431861b65d229b
    with:
      # Crash inputs are public. Set true only for a crate with no unsafe code.
      public-crash-inputs: false
