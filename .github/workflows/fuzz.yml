name: fuzz
on:
  schedule:
    - cron: '45 6 * * 2'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fuzz:
    uses: partsfoundry/crate-workflows/.github/workflows/fuzz.yml@90a7ba403c0e65a6dc3462a37a2c133d23e463fb
    with:
      # Crash inputs are public. Set true only for a crate with no unsafe code.
      public-crash-inputs: false
