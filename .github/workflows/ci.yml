name: check
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  # The push on main is what the release gate reads. A pull request's runs are recorded at the
  # pull request's head SHA, never at the merge commit a release dispatches at, so without this
  # trigger no release can pass the gate.
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    permissions:
      contents: read
      security-events: write
    uses: nifeos/crate-workflows/.github/workflows/check.yml@11d6d6bbf760462fa1e45275d34b55b88dcde44a
    with:
      # Bare-metal targets the crate builds for, space-separated; empty for a host-only crate.
      targets: aarch64-unknown-none-softfloat riscv64imac-unknown-none-elf x86_64-unknown-none
  # Upstream also tests the crate with USE_MULTILEVEL_CACHE off (the `no-default-features` host
  # test profile in tgoskits), where a write reaches the device without waiting in the cache. The
  # shared `tests` job runs the default features only, so this job runs the other profile.
  tests-no-default-features:
    name: tests (no default features)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - run: cargo +stable test --no-default-features
