[package]
name = "rsext4"
version = "0.10.0-partsfoundry.1"
edition = "2024"
rust-version = "1.95"
description = "A lightweight ext4 file system."
authors = ["Dirinkbottle <2909128143@qq.com>"]
repository = "https://github.com/partsfoundry/rsext4"
keywords = ["ext4", "filesystem", "rust"]
categories = ["filesystem"]
license = "Apache-2.0"

[dependencies]
bitflags = "2.10"
spinning_top = { version = "0.3", default-features = false }
thiserror = { version = "2", default-features = false }

[features]
default = ["USE_MULTILEVEL_CACHE"]
host-test = []
USE_MULTILEVEL_CACHE = [] #启用多级缓存

# `cfg(kani)` is set by the Kani model checker, which proves this crate's harnesses.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
